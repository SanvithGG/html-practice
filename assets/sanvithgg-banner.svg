<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients: Black to Deep-Black Grey -->
    <linearGradient id="deepDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020307"/>
      <stop offset="35%" stop-color="#050811"/>
      <stop offset="65%" stop-color="#090d1c"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>

    <!-- Subtle Ambient Neon Accents (Cyan & Purple) -->
    <radialGradient id="cyanAmbient" cx="18%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#020307" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleAmbient" cx="84%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.13"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#020307" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerSoftGlow" cx="42%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#020307" stop-opacity="0"/>
    </radialGradient>

    <!-- Username Typography Gradient -->
    <linearGradient id="usernameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <!-- Underline Glow Gradient -->
    <linearGradient id="underlineLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="codeCardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Faint Digital Grid Pattern -->
    <pattern id="faintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.04"/>
      <circle cx="40" cy="40" r="0.75" fill="#38bdf8" fill-opacity="0.1"/>
    </pattern>

    <!-- Filters for Neon Glow -->
    <filter id="nameGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="laserLineGlow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="particleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Seamless 7-second timing loop */
    @keyframes usernameFadePulse {
      0%, 100% {
        opacity: 0.94;
        filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.3)) drop-shadow(0 0 18px rgba(168, 85, 247, 0.2));
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.65)) drop-shadow(0 0 30px rgba(168, 85, 247, 0.4));
      }
    }

    @keyframes underlineTravel {
      0% {
        transform: translateX(-180px);
        opacity: 0;
      }
      15% {
        opacity: 0.95;
      }
      85% {
        opacity: 0.95;
      }
      100% {
        transform: translateX(420px);
        opacity: 0;
      }
    }

    @keyframes cursorBlink {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes gridHorizontalDrift {
      0% { transform: translateX(0px); }
      100% { transform: translateX(40px); }
    }

    @keyframes floatSym1 {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-8px) translateX(4px); opacity: 0.55; }
    }

    @keyframes floatSym2 {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.18; }
      50% { transform: translateY(7px) translateX(-5px); opacity: 0.5; }
    }

    @keyframes particleDrift {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.25; }
      50% { transform: translateY(-10px) translateX(6px); opacity: 0.8; }
    }

    /* Technology icon gentle fade in/out cycles */
    @keyframes techFade1 {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.95; }
    }
    @keyframes techFade2 {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.35; }
    }
    @keyframes techFade3 {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.9; }
    }
    @keyframes techFade4 {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }

    @keyframes codeLineFade1 {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }
    @keyframes codeLineFade2 {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.3; }
    }

    @keyframes scanLineTerminal {
      0% { transform: translateY(-10px); opacity: 0; }
      25% { opacity: 0.45; }
      75% { opacity: 0.45; }
      100% { transform: translateY(220px); opacity: 0; }
    }

    .main-name {
      font-family: 'Space Grotesk', 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      letter-spacing: 2px;
      animation: usernameFadePulse 7s ease-in-out infinite;
    }

    .cursor-elem {
      animation: cursorBlink 1s infinite;
    }

    .underline-stream {
      animation: underlineTravel 4.2s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
    }

    .grid-drift {
      animation: gridHorizontalDrift 7s linear infinite;
    }

    .sym-float-a { animation: floatSym1 6.5s ease-in-out infinite; }
    .sym-float-b { animation: floatSym2 7s ease-in-out infinite 0.8s; }
    .sym-float-c { animation: floatSym1 6s ease-in-out infinite 1.5s; }

    .particle-float { animation: particleDrift 7s ease-in-out infinite; }

    .code-term-1 { animation: codeLineFade1 7s ease-in-out infinite; }
    .code-term-2 { animation: codeLineFade2 7s ease-in-out infinite; }

    .tech-fade-1 { animation: techFade1 6s ease-in-out infinite; }
    .tech-fade-2 { animation: techFade2 6s ease-in-out infinite 1.5s; }
    .tech-fade-3 { animation: techFade3 6s ease-in-out infinite 3s; }
    .tech-fade-4 { animation: techFade4 6s ease-in-out infinite 4.5s; }

    .terminal-scan {
      animation: scanLineTerminal 5s ease-in-out infinite;
    }
  </style>

  <!-- 1. Black to Deep-Black Grey Background -->
  <rect width="1200" height="360" fill="url(#deepDarkBg)"/>

  <!-- 2. Faint Digital Grid with Slow Horizontal Drift -->
  <g class="grid-drift">
    <rect x="-40" y="0" width="1280" height="360" fill="url(#faintGrid)"/>
  </g>

  <!-- 3. Ambient Neon Lighting Accents -->
  <rect width="1200" height="360" fill="url(#cyanAmbient)"/>
  <rect width="1200" height="360" fill="url(#purpleAmbient)"/>
  <rect width="1200" height="360" fill="url(#centerSoftGlow)"/>

  <!-- 4. Floating Programming Symbols in Background: {}, </>, (), ;, <> -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="700">
    <text class="sym-float-a" x="120" y="65" font-size="20" fill="#00f0ff" fill-opacity="0.3" filter="url(#particleGlow)">&lt;/&gt;</text>
    <text class="sym-float-b" x="510" y="85" font-size="24" fill="#a855f7" fill-opacity="0.3" filter="url(#particleGlow)">{}</text>
    <text class="sym-float-c" x="380" y="325" font-size="20" fill="#38bdf8" fill-opacity="0.3">()</text>
    <text class="sym-float-a" x="610" y="315" font-size="26" fill="#c084fc" fill-opacity="0.35">;</text>
    <text class="sym-float-b" x="90" y="320" font-size="20" fill="#00f0ff" fill-opacity="0.25">&lt;&gt;</text>
    <text class="sym-float-c" x="660" y="60" font-size="18" fill="#64748b" fill-opacity="0.25">{ ... }</text>
    <text class="sym-float-a" x="1135" y="315" font-size="22" fill="#a855f7" fill-opacity="0.3">;</text>
  </g>

  <!-- 5. Subtle Drifting Particles -->
  <circle class="particle-float" cx="240" cy="60" r="1.5" fill="#38bdf8" filter="url(#particleGlow)"/>
  <circle class="particle-float" cx="70" cy="195" r="1.8" fill="#a855f7" filter="url(#particleGlow)"/>
  <circle class="particle-float" cx="490" cy="285" r="1.3" fill="#ffffff"/>
  <circle class="particle-float" cx="630" cy="175" r="1.5" fill="#00f0ff"/>
  <circle class="particle-float" cx="1110" cy="75" r="2" fill="#c084fc" filter="url(#particleGlow)"/>
  <circle class="particle-float" cx="950" cy="330" r="1.4" fill="#38bdf8"/>

  <!-- 6. Left Side: Main Identity (Focal Point) -->
  <g transform="translate(75, 0)">
    <!-- Micro Header Tag -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="186" height="22" rx="11" fill="#080d1e" fill-opacity="0.8" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.35"/>
      <circle cx="12" cy="11" r="3.5" fill="#22c55e" filter="url(#particleGlow)"/>
      <text x="24" y="15" fill="#94a3b8" font-family="'Space Grotesk', 'Segoe UI', monospace" font-size="10" font-weight="700" letter-spacing="1.5">SOFTWARE ENGINEER</text>
    </g>

    <!-- "SanvithGG" Username Heading -->
    <text class="main-name" x="0" y="148" font-size="58" fill="url(#usernameGrad)">SanvithGG</text>

    <!-- Blinking Terminal Cursor beside username -->
    <rect class="cursor-elem" x="350" y="106" width="7" height="46" rx="2" fill="#00f0ff" filter="url(#particleGlow)"/>

    <!-- Thin Glowing Underline underneath the name -->
    <g transform="translate(0, 168)">
      <line x1="0" y1="0" x2="380" y2="0" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.2"/>
      <g class="underline-stream" filter="url(#laserLineGlow)">
        <line x1="0" y1="0" x2="160" y2="0" stroke="url(#underlineLaser)" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="160" cy="0" r="2" fill="#ffffff"/>
      </g>
    </g>

    <!-- Subtitle: "JAVA • JAVASCRIPT • REACT • SPRING BOOT" -->
    <g transform="translate(0, 210)">
      <text font-family="'Space Grotesk', 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" letter-spacing="2.5">
        <tspan fill="#f1f5f9">JAVA</tspan>
        <tspan fill="#00f0ff">  •  </tspan>
        <tspan fill="#f1f5f9">JAVASCRIPT</tspan>
        <tspan fill="#a855f7">  •  </tspan>
        <tspan fill="#f1f5f9">REACT</tspan>
        <tspan fill="#00f0ff">  •  </tspan>
        <tspan fill="#f1f5f9">SPRING BOOT</tspan>
      </text>
    </g>

    <!-- Secondary Technology Labels: "HTML5  •  CSS3" -->
    <g transform="translate(0, 248)">
      <text font-family="'JetBrains Mono', 'Space Grotesk', monospace" font-size="12" font-weight="600" letter-spacing="2.5">
        <tspan fill="#94a3b8">HTML5</tspan>
        <tspan fill="#38bdf8">  •  </tspan>
        <tspan fill="#94a3b8">CSS3</tspan>
        <tspan fill="#475569">   |   </tspan>
        <tspan fill="#64748b">MySQL</tspan>
        <tspan fill="#a855f7">  •  </tspan>
        <tspan fill="#64748b">REST APIs</tspan>
        <tspan fill="#38bdf8">  •  </tspan>
        <tspan fill="#64748b">Git</tspan>
      </text>
    </g>
  </g>

  <!-- 7. Right Side: Sleek Modern Terminal & Code Graphics -->
  <g transform="translate(680, 60)">
    <!-- Terminal Window Container with Glassmorphism -->
    <rect width="445" height="235" rx="10" fill="#060915" fill-opacity="0.82" stroke="url(#codeCardBorder)" stroke-width="1.2"/>

    <!-- Terminal Title Bar -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 435 0 C 440.523 0 445 4.477 445 10 L 445 32 L 0 32 Z" fill="#0a0f22" fill-opacity="0.88"/>
    <line x1="0" y1="32" x2="445" y2="32" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.2"/>

    <!-- Window Control Dots -->
    <circle cx="18" cy="16" r="4" fill="#ef4444" fill-opacity="0.75"/>
    <circle cx="32" cy="16" r="4" fill="#eab308" fill-opacity="0.75"/>
    <circle cx="46" cy="16" r="4" fill="#22c55e" fill-opacity="0.75"/>

    <!-- Active Tab Title -->
    <text x="68" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">SanvithApplication.java</text>

    <!-- Subtle Terminal Laser Scan Line -->
    <g class="terminal-scan" opacity="0.3">
      <line x1="10" y1="0" x2="435" y2="0" stroke="#00f0ff" stroke-width="1.2"/>
    </g>

    <!-- Terminal Code Lines Content -->
    <g transform="translate(18, 54)" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" letter-spacing="0.5">
      <text y="0" fill="#475569">01  <tspan fill="#c084fc">@SpringBootApplication</tspan></text>
      <text y="24" fill="#475569">02  <tspan fill="#38bdf8">public class</tspan> <tspan fill="#ffffff" font-weight="700">SanvithGG</tspan> <tspan fill="#94a3b8">{</tspan></text>
      <text y="48" fill="#475569" class="code-term-1">03    <tspan fill="#f472b6">final</tspan> <tspan fill="#38bdf8">String[]</tspan> <tspan fill="#e2e8f0">stack</tspan> = <tspan fill="#34d399">{"Java", "React", "Spring"}</tspan>;</text>
      <text y="72" fill="#475569" class="code-term-2">04    <tspan fill="#38bdf8">public void</tspan> <tspan fill="#67e8f9">build()</tspan> <tspan fill="#94a3b8">{</tspan></text>
      <text y="96" fill="#475569" class="code-term-1">05      <tspan fill="#c084fc">innovate</tspan>(<tspan fill="#fbbf24">Code::clean</tspan>, <tspan fill="#38bdf8">Architecture::scalable</tspan>);</text>
      <text y="120" fill="#475569">06    <tspan fill="#94a3b8">}</tspan></text>
      <text y="142" fill="#475569">07  <tspan fill="#94a3b8">}</tspan></text>
    </g>

    <!-- Bottom Tech Tags Row Inside Terminal Base -->
    <g transform="translate(16, 202)">
      <!-- Java Badge -->
      <g transform="translate(0, 0)">
        <g class="tech-fade-1">
          <rect width="64" height="20" rx="5" fill="#0f172a" fill-opacity="0.85" stroke="#f97316" stroke-width="0.8" stroke-opacity="0.5"/>
          <text x="32" y="14" fill="#fb923c" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Java</text>
        </g>
      </g>

      <!-- JavaScript Badge -->
      <g transform="translate(74, 0)">
        <g class="tech-fade-2">
          <rect width="84" height="20" rx="5" fill="#0f172a" fill-opacity="0.85" stroke="#eab308" stroke-width="0.8" stroke-opacity="0.5"/>
          <text x="42" y="14" fill="#facc15" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">JavaScript</text>
        </g>
      </g>

      <!-- React Badge -->
      <g transform="translate(168, 0)">
        <g class="tech-fade-3">
          <rect width="78" height="20" rx="5" fill="#0f172a" fill-opacity="0.85" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.5"/>
          <text x="39" y="14" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">React.js</text>
        </g>
      </g>

      <!-- Spring Boot Badge -->
      <g transform="translate(256, 0)">
        <g class="tech-fade-4">
          <rect width="98" height="20" rx="5" fill="#0f172a" fill-opacity="0.85" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.5"/>
          <text x="49" y="14" fill="#4ade80" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Spring Boot</text>
        </g>
      </g>
    </g>
  </g>

  <!-- 8. Minimalist Futuristic Corner HUD Accents -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M 1176 44 L 1176 24 L 1156 24" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M 24 316 L 24 336 L 44 336" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M 1176 316 L 1176 336 L 1156 336" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Sleek Outer Boundary Line -->
  <rect x="10" y="10" width="1180" height="340" rx="8" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.08"/>
</svg>